name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # 30 in-game days headless: no NaNs or escapes, byte-stable saves, step cost, flat memory.
      - run: npm run soak
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Art QA shots (Plan Part 7.10): screenshots + render budgets, kept as a CI artifact.
      - run: npm run shots -- --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: artifacts/shots/
          if-no-files-found: ignore
