<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearthwood</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1330; color: #f3ebdd; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      .overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 0.4rem; text-align: center;
        font-family: Georgia, 'Times New Roman', serif; pointer-events: none; z-index: 1;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { font-weight: normal; font-size: 3.2rem; letter-spacing: 0.06em; margin: 0; }
      .overlay p { margin: 0; font-size: 1.1rem; }
      .overlay .quiet { opacity: 0.7; }
      .hint {
        position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1;
        padding: 6px 14px; border-radius: 14px; background: rgba(11, 19, 48, 0.45);
        font: 14px Georgia, 'Times New Roman', serif; color: #f3ebdd; pointer-events: none; white-space: nowrap;
      }
      .hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
